[package]
name = "wpmulti-uniffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
description = "UniFFI bindings for the wpmulti Rust engine (Android VPN)"
repository = "https://github.com/pkok1099/wpmulti-rs"

[lib]
name = "wpmulti_uniffi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
wpmulti = { path = "../.." }
uniffi = { version = "=0.32.2", features = ["tokio", "cli"] }
tokio = { version = "1.43.0", features = ["full"] }
thiserror = "2"
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["full"] }

[lints.rust]
# unsafe_code is deny (not forbid): attach_tun must take ownership of the
# raw TUN fd from Android, and std has no safe API for that conversion.
# The single `unsafe { OwnedFd::from_raw_fd(fd) }` in lib.rs carries an
# allow with a reason; forbid would turn that allow into a hard E0453.
# Everything else in this crate stays unsafe-free.
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
await_holding_lock = "deny"
wildcard_enum_match_arm = "deny"
unnested_or_patterns = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
