# Strict Clippy configuration for wpmulti
# Enforced alongside [lints.clippy] in Cargo.toml and `-D warnings` in CI.

msrv = "1.100"
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 6
type-complexity-threshold = 200
max-fn-params-bools = 2
avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
# std::process::exit dilarang via `exit = "deny"` di Cargo.toml [lints.clippy].
# (dulu di disallowed-methods; set_var/remove_var sudah mati: unsafe fn di edition 2024 + unsafe_code = "forbid")
stack-size-threshold = 262144

