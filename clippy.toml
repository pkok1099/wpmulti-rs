# Strict Clippy configuration for wpmulti
# Enforced alongside [lints.clippy] in Cargo.toml and `-D warnings` in CI.

msrv = "1.100"
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 6
too-many-lines-threshold = 100
type-complexity-threshold = 200
max-struct-bools = 3
max-fn-params-bools = 2
avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
disallowed-methods = [
  { path = "std::process::exit", reason = "Bypasses Drop destructors and secret zeroization; return an error or exit code from main instead" },
  { path = "std::env::set_var", reason = "Unsafe in multi-threaded Tokio runtime" },
  { path = "std::env::remove_var", reason = "Unsafe in multi-threaded Tokio runtime" },
]
stack-size-threshold = 262144

