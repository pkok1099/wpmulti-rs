[workspace]
members = ["crates/wpmulti-uniffi"]

[package]
name = "wpmulti"
version = "0.2.16-beta"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
description = "High-concurrency multi-tunnel WireGuard proxy daemon for gotatun"
repository = "https://github.com/pkok1099/wpmulti-rs"
readme = "README.md"
keywords = ["wireguard", "proxy", "socks5", "gotatun", "userspace"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "wpmulti"
path = "src/lib.rs"

[[bin]]
name = "wpmulti"
path = "src/main.rs"

[[bench]]
name = "performance"
harness = false

[dependencies]
gotatun = { git = "https://github.com/mullvad/gotatun", rev = "e95ba9693c15c9063a8c0293d9cbc67aef15eb1d", features = ["device"], default-features = false }
gotatun-crypto = { git = "https://github.com/mullvad/gotatun", rev = "e95ba9693c15c9063a8c0293d9cbc67aef15eb1d" }
gotatun-packet = { git = "https://github.com/mullvad/gotatun", rev = "e95ba9693c15c9063a8c0293d9cbc67aef15eb1d" }
tokio = { version = "1.43.0", features = ["full"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "reusable_secrets", "serde"] }
ipnetwork = { version = "0.21.1", features = ["serde"] }
base64 = "0.23.1"
bytes = "1"
smallvec = "1"
thiserror = "2"
tracing = "0.1.40"
tracing-subscriber = "0.3.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1"
toml_edit = "0.22"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-dns", "async"] }
parking_lot = "0.13.0"
rand = "0.10.4"
zerocopy = { version = "0.8.27", features = ["derive", "std"] }
libc = "0.2"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
tokio-rustls = "0.26"
webpki-roots = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3.27.0"
etherparse = "0.21.0"
serde_json = "1.0"
rand = "0.10.4"
zerocopy = { version = "0.8.27", features = ["derive", "std"] }
eyre = "0.6.12"

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["gotatun/aws-lc-rs"]
ring = ["gotatun/ring"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# Android (UniFFI) profile: panic must unwind so a Rust panic at the FFI
# boundary becomes a Kotlin exception instead of crashing the process.
# The daemon's [profile.release] stays panic=abort and is untouched.
[profile.release-android]
inherits = "release"
panic = "unwind"
lto = "thin"
codegen-units = 16
# Do not strip: UniFFI metadata lives in the symbol table and
# uniffi-bindgen reads it from the .so to generate bindings.
# The Android Gradle build strips the .so at packaging time.
strip = false

[profile.profiling]
inherits = "release"
debug = true
strip = false

[package.metadata.deb]
maintainer = "pkok1099"
copyright = "2026, pkok1099"
license-file = ["LICENSE", "0"]
depends = "$auto"
section = "net"
priority = "optional"
conf-files = ["/etc/wpmulti/wpmulti.toml"]
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/wpmulti", "usr/bin/", "755"],
    ["packaging/wpmulti.toml", "etc/wpmulti/wpmulti.toml", "660"],
    ["packaging/wpmulti.service", "lib/systemd/system/wpmulti.service", "644"],
    ["README.md", "usr/share/doc/wpmulti/README.md", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/wpmulti/THIRD_PARTY_NOTICES.md", "644"],
]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# no silent lint suppression: every #[allow] must carry a reason
allow_attributes_without_reason = "deny"

# pedantic noise allowances (keep safety & structure strict)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"

# code hygiene & complexity
# deny, bukan forbid: derive clap mengeluarkan #[allow(clippy::restriction)]
# dan forbid + allow = E0453 (terverifikasi 18 Nov 2026 saat flip dicoba).
# deny sudah menggagalkan build bila dilanggar; forbid hanya menambah
# "tidak bisa di-override", yang justru bentrok dengan derive clap.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"
trivially_copy_pass_by_ref = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
format_push_string = "warn"
rc_buffer = "warn"
box_collection = "warn"
significant_drop_tightening = "warn"

# match / enum
wildcard_in_or_patterns = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unnested_or_patterns = "deny"

# supaya clippy.toml efektif
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"

# async / lock
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

# anti-crash & destructor safety
# unwrap_used tetap deny (bukan forbid): alasan sama, lihat komentar di atas.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
exit = "deny"
mem_forget = "warn"

# TUI / logging hygiene
print_stdout = "warn"
print_stderr = "warn"

# restriction — paket konsensus 18 Nov 2026 (debat clippy ronde 2)
# 0 temuan: self_named_module_files, empty_structs_with_brackets, pub_without_shorthand
# kecil: clone_on_ref_ptr (5), if_then_some_else_none (3), semicolon_outside_block (13), else_if_without_else (15)
self_named_module_files = "warn"
empty_structs_with_brackets = "warn"
pub_without_shorthand = "warn"
clone_on_ref_ptr = "warn"
if_then_some_else_none = "warn"
semicolon_outside_block = "warn"
else_if_without_else = "warn"

